# Production stack. Every secret and setting lives in .env (see .env.example);
# nothing sensitive is committed here.
#
#   Internet ──443/80──▶ caddy (HTTPS) ──▶ app ──▶ db (Postgres)
#                                              └──▶ minio (photos)
#   backup: daily pg_dump + photo mirror into ./backups (optionally off-site)

x-logging: &logging
  # Rotate container logs so they can't fill the disk.
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: photoshare
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: photoshare
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U photoshare"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  minio:
    # MinIO stopped publishing images (minio/minio and minio/mc no longer
    # pull from Docker Hub or Quay); pgsty/* is a drop-in community build.
    image: docker.io/pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio_data:/data
    ports:
      # Localhost only — never exposed to the internet. On a server, reach
      # the console through an SSH tunnel: ssh -L 9001:localhost:9001 host
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    logging: *logging

  createbuckets:
    image: docker.io/pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\"; do echo 'waiting for minio'; sleep 2; done;
      mc mb --ignore-existing local/photos;
      mc anonymous set none local/photos;
      echo 'bucket ready';
      "
    logging: *logging

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    # Optional settings (APP_URL, SMTP_*, TURNSTILE_*, LEGAL_*, quotas…) come
    # straight from .env; the entries below override the local-dev values.
    env_file: .env
    environment:
      DATABASE_URL: "postgresql://photoshare:${POSTGRES_PASSWORD}@db:5432/photoshare?schema=public"
      S3_ENDPOINT: "http://minio:9000"
      S3_REGION: "us-east-1"
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: "photos"
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      # Served over HTTPS by caddy, so session cookies are Secure.
      COOKIE_SECURE: "true"
    # Not published: only reachable through caddy.
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    logging: *logging

  caddy:
    image: docker.io/library/caddy:2.11.7-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      MAX_REQUEST_BODY: ${MAX_REQUEST_BODY:-210MB}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: *logging

  backup:
    build: ./backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_REMOTE_URL: ${BACKUP_REMOTE_URL:-}
      BACKUP_REMOTE_BUCKET: ${BACKUP_REMOTE_BUCKET:-}
      BACKUP_REMOTE_ACCESS_KEY: ${BACKUP_REMOTE_ACCESS_KEY:-}
      BACKUP_REMOTE_SECRET_KEY: ${BACKUP_REMOTE_SECRET_KEY:-}
    volumes:
      - ./backups:/backups
    logging: *logging

volumes:
  db_data:
  minio_data:
  caddy_data:
  caddy_config:
